<!DOCTYPE html>
<meta charset="utf-8">
<style type="text/css">
  .node {
    cursor: pointer;
  }

  .overlay {
    min-height: 100vh;
    background-color: #EEE;
    width: 100%;
    height: 100%;
  }

  .node circle {
    fill: #fff;
    stroke: rgb(70, 180, 83);
    stroke-width: 1.5px;
  }

  .node text {
    font-size: 15px;
    font-family: sans-serif;
  }

  .link {
    fill: none;
    stroke: #ccc;
    stroke-width: 1.5px;
  }

  /* .templink {
    fill: none;
    stroke: red;
    stroke-width: 3px;
  } */

  .ghostCircle.show {
    display: block;
  }

  .ghostCircle,
  .activeDrag .ghostCircle {
    display: none;
  }

  .tooltip {
    position: absolute;
    font-family: 'Trebuchet MS', sans-serif;
    pointer-events: none;
  }

.child {
  display: inline-block;
}



</style>

</div>
